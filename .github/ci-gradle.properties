# Optimized Gradle settings for CI environment
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.caching=true
org.gradle.isolated-projects=true

# Memory allocation tailored for GitHub Actions standard runner (7GB RAM)
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -Xmx3584m
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -Xmx2048m

# Incremental & KSP compilation optimizations
kotlin.incremental=true
kotlin.cached.precompiled.scripts=true
ksp.incremental=true
ksp.incremental.intermodule=true
ksp.project.isolation.enabled=true

# Android compilation & shrinking performance
android.enableR8.fullMode=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# CI-specific flags
warningsAsErrors=true

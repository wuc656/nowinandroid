# Dependabot configuration for Now in Android
version: 2
updates:
  # Maintain dependencies for Gradle (includes libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      androidx:
        patterns:
          - "androidx.*"
        update-types:
          - "minor"
          - "patch"
      kotlin-and-ksp:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "com.google.devtools.ksp*"
        update-types:
          - "minor"
          - "patch"
      google-and-play:
        patterns:
          - "com.google.*"
        exclude-patterns:
          - "com.google.devtools.ksp*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # okhttp 5.5.0+ requires compileSdk 37
      - dependency-name: "com.squareup.okhttp3:*"
        versions: [">= 5.5.0"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

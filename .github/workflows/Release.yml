name: Production Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否自動建立 GitHub Release (並發布 APK 與 AAB)'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release 標籤名稱 (若為空將使用 App 當前版本號，例如 v1.0.8)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: "Build & Sign Production Release"
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: 'enhanced'
          cache-read-only: true
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      - name: Setup Release Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > release.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "Keystore successfully configured."
          else
            echo "No SIGNING_KEY secret found. Will fallback to debug signing as configured in build.gradle.kts."
          fi

      - name: Build Production Release (APK & AAB)
        run: ./gradlew :app:bundleProdRelease :app:assembleProdRelease --project-prop "gradle.properties=.github/ci-gradle.properties" --stacktrace

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prod-release-artifacts
          path: |
            app/build/outputs/apk/prod/release/*.apk
            app/build/outputs/bundle/prodRelease/*.aab

      - name: Determine Version Tag
        id: version_tag
        if: ${{ inputs.create_release }}
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION_NAME}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved release tag: $TAG"

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_tag.outputs.tag }}
          name: Now in Android ${{ steps.version_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/prod/release/*.apk
            app/build/outputs/bundle/prodRelease/*.aab
